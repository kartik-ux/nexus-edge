[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-edge"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4", "joblib>=1.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
